<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nordic Mythos</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css?v=9">
    
    <link rel="icon" type="image/jpeg" href="images/favicon.jpg">
    <meta name="description" content="Nordic Mythos i Aalborg - Se vores lækre pizzakatalog online. Bestil nemt og hurtigt den bedste pizza i Aalborg via Wolt!">
    <meta name="keywords" content="pizza, pizzeria, Aalborg, pizzakatalog, takeaway, mad, Ved Stranden, Wolt, Nordic Mythos">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://nordicmythos.dk/">

    <meta property="og:title" content="Nordic Mythos - Pizzakatalog Aalborg">
    <meta property="og:description" content="Se vores lækre pizzakatalog online og bestil direkte via Wolt. Smag legenden på Ved Stranden 19!">
    <meta property="og:image" content="logo.jpg">
    <meta property="og:url" content="https://nordicmythos.dk">
    <meta property="og:type" content="website">
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Restaurant",
      "name": "Nordic Mythos",
      "image": "https://nordicmythos.dk/logo.jpg",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Ved Stranden 19",
        "addressLocality": "Aalborg",
        "postalCode": "9000",
        "addressCountry": "DK"
      },
      "telephone": "+4593949755",
      "url": "https://nordicmythos.dk",
      "servesCuisine": ["Pizza", "Italian", "Nordic", "Greek"],
      "priceRange": "$$",
      "sameAs": [
        "https://wolt.com/da/dnk/aalborg/restaurant/mythos-pizza"
      ]
    }
    </script>
</head>
<body>

    <header class="menu-header">
        <div class="language-switcher dropdown">
            <button class="dropbtn" id="current-lang-btn">🇩🇰 DA <i class="fas fa-chevron-down"></i></button>
            <div class="dropdown-content">
                <a href="#" onclick="setLanguage('da'); return false;">🇩🇰 Dansk</a>
                <a href="#" onclick="setLanguage('en'); return false;">🇬🇧 English</a>
                <a href="#" onclick="setLanguage('el'); return false;">🇬🇷 Ελληνικά</a>
            </div>
        </div>
        <div class="logo-container">
            <img src="logo.jpg" alt="Nordic Mythos Logo" class="main-logo">
        </div>
        <h1>NORDIC MYTHOS</h1>
        <h2>PIZZAKATALOG</h2>
        <p class="tagline" data-i18n="tagline">Taste the legend</p>
    </header>

    <main class="menu-container">
        <section class="menu-section">
            <div class="pizza-grid" id="menu-container">
                <p style="text-align: center; font-weight: bold; width: 100%; grid-column: 1 / -1;">
                    <span data-i18n="loading">Indlæser menu...</span>
                </p>
            </div>
        </section>
    </main>

    <div id="pizza-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">×</span>
            <div class="modal-image-container">
                <img id="modal-image" src="" alt="Pizza Image">
            </div>
            <div class="modal-details">
                <div class="modal-header-row">
                    <span id="modal-number" class="pizza-number">00</span>
                    <h2 id="modal-title">PIZZA TITLE</h2>
                    <span id="modal-price" class="pizza-price">00 KR.</span>
                </div>
                <p id="modal-ingredients"></p>
            </div>
        </div>
    </div>

    <footer class="menu-footer">
        <div class="footer-info">
            <a href="tel:+4593949755" class="footer-link">
                <span class="phone">📞 93949755</span>
            </a>
            <a href="https://wolt.com/da/dnk/aalborg/restaurant/mythos-pizza?srsltid=AfmBOorvtUlsmwlpqY_njT0AXNxkM7JZ2VbnfQ4wDxzJuphT5mWSL-1y" target="_blank" rel="noopener noreferrer" class="wolt-btn">
                <span data-i18n="orderWolt">Order via Wolt</span>
            </a>
            <a href="https://www.google.com/maps/search/?api=1&query=Ved+Stranden+19,+9000+Aalborg,+Denmark" target="_blank" rel="noopener noreferrer" class="footer-link">
                <span class="address">📍 VED STRANDEN 19, 9000 AALBORG</span>
            </a>
        </div>

        <div class="social-links">
            <a href="https://www.facebook.com/share/1T1uzixrSJ/" target="_blank" rel="noopener noreferrer" class="social-icon facebook" aria-label="Facebook">
                <i class="fab fa-facebook-f"></i>
            </a>
            <a href="https://www.instagram.com/nordic.mythos?igsh=aGRsMG55OHJlZHdu" target="_blank" rel="noopener noreferrer" class="social-icon instagram" aria-label="Instagram">
                <i class="fab fa-instagram"></i>
            </a>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
